# ── Snippet security headers (utilisé partout via map) ────────────
map $sent_http_content_type $security_csp {
    # script-src : 'self' + hash du script anti-FOUC inline de index.html (pose
    # .dark sur <html> avant hydratation React, cf. ThemeContext.jsx). Recalculer
    # ce hash si ce script inline change (frontend/index.html, <head>) :
    #   python3 -c "import re,hashlib,base64; h=open('index.html',encoding='utf-8').read(); m=re.search(r'<script>(.*?)</script>',h,re.DOTALL); print('sha256-'+base64.b64encode(hashlib.sha256(m.group(1).encode()).digest()).decode())"
    default "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'sha256-6YqL2WXf65GwFIutjSzZ3XBslI9JHzlaeNSbTXw7gT0='; connect-src 'self' https://lost-card.softskills.ci; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;
    server_tokens off;

    # ═══════════════════════════════════════════════════════════════
    # SECURITY HEADERS (always = appliqués même sur les 4xx/5xx)
    # `always` empêche le reset par les add_header dans les locations
    # ═══════════════════════════════════════════════════════════════
    add_header X-Frame-Options                   "DENY"                            always;
    add_header X-Content-Type-Options            "nosniff"                         always;
    add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy                "camera=(self), microphone=(), geolocation=(self), interest-cohort=()" always;
    add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy        "same-origin"                     always;
    add_header X-Permitted-Cross-Domain-Policies "none"                            always;
    add_header Content-Security-Policy           $security_csp                     always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── index.html et sw.js : pas de cache + on RE-applique les security headers ──
    # (un add_header dans une location reset ceux du parent, on doit donc tout répéter)
    location ~* (index\.html|sw\.js)$ {
        add_header X-Frame-Options                   "DENY"                            always;
        add_header X-Content-Type-Options            "nosniff"                         always;
        add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy                "camera=(self), microphone=(), geolocation=(self), interest-cohort=()" always;
        add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy        "same-origin"                     always;
        add_header X-Permitted-Cross-Domain-Policies "none"                            always;
        add_header Content-Security-Policy           $security_csp                     always;
        add_header Cache-Control                     "no-cache, no-store, must-revalidate" always;
        add_header Pragma                            "no-cache"                        always;
        expires 0;
        try_files $uri /index.html;
    }

    # ── Assets Vite hashés : cache long + security headers ──
    location /assets/ {
        add_header X-Frame-Options                   "DENY"                            always;
        add_header X-Content-Type-Options            "nosniff"                         always;
        add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control                     "public, max-age=31536000, immutable" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Sanctum CSRF
    location /sanctum/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
