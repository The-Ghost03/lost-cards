<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hors ligne — LostCards</title>
  <link rel="icon" href="/favicon.svg">
  <meta name="theme-color" content="#f97316">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0f172a;
      color: #f9fafb;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #1f2937;
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(249, 115, 22, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      color: #9ca3af;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #f97316;
      color: white;
      border: none;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 14px;
      width: 100%;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover { background: #ea580c; }
    button:active { transform: scale(0.98); }
    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 20px;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Connexion indisponible</h1>
    <p>
      Vérifiez votre connexion internet et réessayez.<br>
      Les pages déjà visitées restent consultables.
    </p>
    <button onclick="window.location.reload()">Réessayer</button>
    <div class="small">
      <span class="pulse"></span>En attente de connexion…
    </div>
  </div>

  <script>
    // Auto-reload dès que la connexion revient
    window.addEventListener('online', () => window.location.reload())
  </script>
</body>
</html>
